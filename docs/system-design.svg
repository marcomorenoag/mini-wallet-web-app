<text x="40" y="82.0" font-size="16" fill="#495057" text-anchor="start">Hexagonal-lite on Next.js 16 · current mock adapters (solid) vs. production target (dashed)</text>
<rect x="40" y="140" width="280" height="220" rx="10" fill="#d0ebff" stroke="#1971c2" stroke-width="2"/>

<text x="50" y="165.0" font-size="15" fill="#1971c2" text-anchor="start">Client · Browser (mobile-first)</text>
<text x="50" y="183.75" font-size="15" fill="#1971c2" text-anchor="start"></text>
<text x="50" y="202.5" font-size="15" fill="#1971c2" text-anchor="start">• Login · Home · Transfer · Voucher</text>
<text x="50" y="221.25" font-size="15" fill="#1971c2" text-anchor="start">• TransferFlowProvider</text>
<text x="50" y="240.0" font-size="15" fill="#1971c2" text-anchor="start">  (Context + useReducer)</text>
<text x="50" y="258.75" font-size="15" fill="#1971c2" text-anchor="start">• Zod schemas (UX feedback)</text>
<text x="50" y="277.5" font-size="15" fill="#1971c2" text-anchor="start">• next-intl · es-MX / MXN</text>
<text x="50" y="296.25" font-size="15" fill="#1971c2" text-anchor="start">• Idempotency key per draft</text>
