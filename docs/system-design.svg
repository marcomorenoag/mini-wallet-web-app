<text x="860.0" y="311.25" font-size="15" fill="#6741d9" text-anchor="middle">Server</text>
<text x="860.0" y="330.0" font-size="15" fill="#6741d9" text-anchor="middle">Actions</text>
<rect x="420" y="400" width="520" height="110" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>

<text x="680.0" y="434.0" font-size="14" fill="#2f9e44" text-anchor="middle">Use cases (application)</text>
<text x="680.0" y="451.5" font-size="14" fill="#2f9e44" text-anchor="middle">login · getAccount · listMovements · listContacts</text>
<text x="680.0" y="469.0" font-size="14" fill="#2f9e44" text-anchor="middle">saveContact · createTransfer(key) · getTransferStatus(key)</text>
<text x="680.0" y="486.5" font-size="14" fill="#2f9e44" text-anchor="middle">ownership check: every query is scoped to session userId</text>
<rect x="420" y="540" width="520" height="100" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>

<text x="680.0" y="569.0" font-size="14" fill="#2f9e44" text-anchor="middle">Domain (pure TS — no React / Next)</text>
<text x="680.0" y="586.5" font-size="14" fill="#2f9e44" text-anchor="middle">Money (cents + MXN) · Zod schemas · transfer rules</text>
<text x="680.0" y="604.0" font-size="14" fill="#2f9e44" text-anchor="middle">amount &gt; 0 · amount ≤ balance · recipient required</text>
<text x="680.0" y="621.5" font-size="14" fill="#2f9e44" text-anchor="middle">typed error codes (INSUFFICIENT_FUNDS, TIMEOUT, …)</text>
<rect x="420" y="670" width="520" height="140" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>

<text x="680.0" y="708.125" font-size="15" fill="#e67700" text-anchor="middle">Ports (interfaces)</text>
<text x="680.0" y="726.875" font-size="15" fill="#e67700" text-anchor="middle"></text>
<text x="680.0" y="745.625" font-size="15" fill="#e67700" text-anchor="middle">SessionPort · AccountRepository</text>
<text x="680.0" y="764.375" font-size="15" fill="#e67700" text-anchor="middle">TransactionRepository · ContactRepository</text>
<text x="680.0" y="783.125" font-size="15" fill="#e67700" text-anchor="middle">IdempotencyStore</text>
<rect x="1040" y="400" width="360" height="150" rx="10" fill="#fff3bf" stroke="#e67700" stroke-width="2"/>

<text x="1050" y="425.0" font-size="15" fill="#e67700" text-anchor="start">Adapters — current (mock)</text>
<text x="1050" y="443.75" font-size="15" fill="#e67700" text-anchor="start"></text>
<text x="1050" y="462.5" font-size="15" fill="#e67700" text-anchor="start">• In-memory repos (globalThis)</text>
<text x="1050" y="481.25" font-size="15" fill="#e67700" text-anchor="start">• Typed TS fixtures (satisfies)</text>
<text x="1050" y="500.0" font-size="15" fill="#e67700" text-anchor="start">• Simulated latency</text>
<text x="1050" y="518.75" font-size="15" fill="#e67700" text-anchor="start">• x-mock-scenario override (non-prod)</text>
<rect x="1040" y="620" width="360" height="200" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2" stroke-dasharray="8 6"/>

<text x="1050" y="645.0" font-size="15" fill="#495057" text-anchor="start">Adapters — production target</text>
<text x="1050" y="663.75" font-size="15" fill="#495057" text-anchor="start"></text>
<text x="1050" y="682.5" font-size="15" fill="#495057" text-anchor="start">• PostgreSQL: ACID ledger</text>
<text x="1050" y="701.25" font-size="15" fill="#495057" text-anchor="start">  primary + read replicas</text>
<text x="1050" y="720.0" font-size="15" fill="#495057" text-anchor="start">• Redis: sessions, idempotency keys,</text>
<text x="1050" y="738.75" font-size="15" fill="#495057" text-anchor="start">  read cache</text>
<text x="1050" y="757.5" font-size="15" fill="#495057" text-anchor="start">• Payments / ledger service</text>
<text x="1050" y="776.25" font-size="15" fill="#495057" text-anchor="start">• Observability (logs, traces)</text>
<rect x="40" y="600" width="280" height="210" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>

<text x="50" y="625.0" font-size="15" fill="#e03131" text-anchor="start">NFRs · capacity (100M DAU)</text>
<text x="50" y="643.75" font-size="15" fill="#e03131" text-anchor="start"></text>
<text x="50" y="662.5" font-size="15" fill="#e03131" text-anchor="start">• Login ≈ 1K rps</text>
<text x="50" y="681.25" font-size="15" fill="#e03131" text-anchor="start">• Home reads ≈ 10K rps</text>
<text x="50" y="700.0" font-size="15" fill="#e03131" text-anchor="start">• Transfers ≈ 10K rps</text>
<text x="50" y="718.75" font-size="15" fill="#e03131" text-anchor="start">• Consistency over availability</text>
<text x="50" y="737.5" font-size="15" fill="#e03131" text-anchor="start">• ACID · idempotent transfers</text>
<text x="50" y="756.25" font-size="15" fill="#e03131" text-anchor="start">• 99.9% availability</text>
<text x="50" y="775.0" font-size="15" fill="#e03131" text-anchor="start">• Owner-scoped data · PII-ready</text>
